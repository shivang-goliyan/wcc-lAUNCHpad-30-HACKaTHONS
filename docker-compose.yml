# Deploy on the VM:  cp .env.example .env  (fill it)  →  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nami}
      POSTGRES_DB: nami
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nami"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://nami:${POSTGRES_PASSWORD:-nami}@db:5432/nami
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: ["pnpm", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://nami:${POSTGRES_PASSWORD:-nami}@db:5432/nami
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. namicare.xyz or 1-2-3-4.sslip.io}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
